[project]
name = "apex-forecast"
version = "0.1.0"
description = "Probabilistic Formula 1 race forecasting under the 2026 regulations"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastf1==3.8.3",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16.0",
    "duckdb>=1.0",
    "statsmodels>=0.14",
    "scipy>=1.13",
    "requests>=2.32",
]

[project.optional-dependencies]
model = [
    "numpyro>=0.15",
    "jax>=0.4.30",
    "arviz>=0.18",
]
dev = [
    "pytest>=8.0",
    # Pinned, not floated. Ruff ships new rules in its default set between minor
    # releases, so an unpinned linter turns a green repo red with no source change.
    "ruff==0.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apex"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
