# Refresh the model after a race, and forecast the next one.
#
# This does NOT run on a schedule, and the reason is measured rather than assumed.
# FastF1 reads race data from livetiming.formula1.com, which answers 403 to datacenter
# IP ranges. FastF1 then falls back to its mirror, which does not carry archived
# sessions and answers 404. Probed 2026-08-19 against the R11 race feed:
#
#   from a GitHub-hosted runner   primary 403   mirror 404
#   from a residential connection primary 200 (7.2 MB)   mirror 404
#
# Same pin, same session, same code. So no retry, no cache key and no version bump makes
# a hosted runner able to ingest a race weekend. Four consecutive Tuesday runs failed
# this way before the schedule was removed; the cache never helped because actions/cache
# is post-if:success(), so a job that fails never seeds the cache it needed to succeed.
#
# The refresh therefore runs locally, where the feed is readable:
#
#   make all                          # ingest, refit Layers 0/1, publish, refresh news
#   python scripts/score_race.py --round N   # grade the round against its prediction log
#   git add web/data reports && git commit
#
# This workflow is kept for a runner that can reach live timing (self-hosted, or a local
# act run). On a hosted runner the spike reports exit 2 and it stops cleanly instead of
# going red for a reason that is not a defect in this project.
#
# What it deliberately does not do: apply grid penalties. Those are not in any machine
# -readable feed this project can reach, so a fully automatic pre-race forecast is built
# off the qualifying classification and says so. To correct it, add
# grids/{season}_R{round}.csv and re-run — see grids/README.md.
name: update

on:
  workflow_dispatch:
    inputs:
      score_round:
        description: "Round to score against its prediction log (blank = skip)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"          # 3.14 breaks the scientific stack

      # The accumulated training set. `data/` is gitignored because it is reproducible in
      # principle, but reproducing it means re-downloading every session of the season on
      # every run. Restoring it instead means only the new race weekend is fetched.
      #
      # Note this can only ever help on a runner that can read live timing at all: the
      # save step is post-if:success(), so a run that dies at the spike leaves no cache
      # behind for the next one.
      - uses: actions/cache@v4
        with:
          path: |
            data/cache
            data/raw
          key: apex-data-${{ github.run_id }}
          restore-keys: apex-data-

      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[dev,model]"

      # Three outcomes, kept distinct on purpose:
      #   0  the feed parses -> refresh
      #   2  no host will serve this runner -> stop, cleanly, this is not a defect
      #   1  a host served data that does not parse -> schema drift, fail loudly
      - name: Verify FastF1 still parses a current session
        id: spike
        run: |
          set +e
          make spike
          code=$?
          set -e
          if [ "$code" = "0" ]; then
            echo "usable=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" = "2" ]; then
            echo "usable=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Refresh skipped::Live timing refuses this runner (403). Run 'make all' locally."
          else
            exit $code
          fi

      - name: Ingest, refit, publish
        if: steps.spike.outputs.usable == 'true'
        run: make all

      - name: Score the race that just ran
        # Only scores where a prediction log written before the race exists; score_race.py
        # refuses rather than grading a forecast belonging to another round.
        if: steps.spike.outputs.usable == 'true' && inputs.score_round != ''
        run: .venv/bin/python scripts/score_race.py --round ${{ inputs.score_round }}

      # Needs no network, so it runs either way and the dispatch is never wasted.
      - name: Test and lint
        run: make test lint

      - name: Commit
        if: steps.spike.outputs.usable == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # data/ is gitignored and reproducible; only the published payloads, the
          # write-once prediction log and the reports are worth committing.
          git add web/data reports || true
          if git diff --staged --quiet; then
            echo "nothing changed"
          else
            git commit -m "Refresh the model and forecast the next round"
            git push
          fi
